services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path",
        "/migrations",
        "-database",
        "postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable",
      ]
    command: ["up"]
    restart: "no"

  localstack:
    image: localstack/localstack:4.3
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/jungle-wallet-realm.json:/opt/keycloak/data/import/jungle-wallet-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api: &api_service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.24.7"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
      OIDC_ISSUER_URL: http://localhost:8081/realms/jungle-wallet
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/jungle-wallet
      OIDC_AUDIENCE: ""
    ports:
      - "18080:8080"

  api-1:
    <<: *api_service
    ports:
      - "18081:8080"

  api-2:
    <<: *api_service
    ports:
      - "18082:8080"

  api-3:
    <<: *api_service
    ports:
      - "18083:8080"

volumes:
  postgres_data:
  localstack_data:
